<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduler</title>
    <!-- Styles -->
    <link rel="stylesheet" href="/styles/styles.css">
    <!-- Script -->
    <script src="/scripts/script.js" defer></script>
</head>
<body>
    <main>
        <div id="main">
            <h1>Appointment Scheduler</h1>
            <form id="appointment" method="get" action="#">
                <fieldset class="field-body">
                    <label for="fname">First name</label>
                    <input type="text" id="fname" name="fname">
                    <span class="error-msg" id="error-msg-fname">Please enter your first name</span>
                    
                    
                    <label for="lname">Last name</label>
                    <input type="text" id="lname" name="lname">
                    <span class="error-msg" id="error-msg-lname">Please enter your last name</span>

                    <label for="meeting-date">Meeting Date</label>
                    <input type="date" name="meeting-date" id="meeting-date">
                    <span class="error-msg" id="error-msg-date">Please select a date for the appointment</span>

                    <label for="meeting-time">Meeting Time</label>
                    <input type="time" id="meeting-time" name="meeting-time">
                    <span class="error-msg" id="error-msg-time">Please select a meeting time</span>

                    <button type="submit" id="submit">Book Appointment</button>git
                </fieldset>
            </form>
        </div>
    </main>
</body>
</html>
